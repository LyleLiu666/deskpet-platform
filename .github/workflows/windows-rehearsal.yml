name: Windows isolated rehearsal
on:
  push:
    branches: [codex/windows-rehearsal]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install .
      - name: Test Windows behavior
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd/src"
          foreach ($test in @('test_file_lock.py', 'test_windows_pairing.py', 'test_windows_private.py', 'test_windows_scenario.py')) {
            & python -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
