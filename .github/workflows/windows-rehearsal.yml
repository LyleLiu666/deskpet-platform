name: Windows isolated rehearsal
on:
  push:
    branches: [codex/windows-rehearsal]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install twice from a path with spaces
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'DeskPet fresh install'
          Copy-Item -Recurse -LiteralPath $pwd -Destination $target
          Set-Location $target
          ./install-windows.ps1
          ./install-windows.ps1
          $env:PYTHONIOENCODING = "cp1252"
          & ./.venv/Scripts/deskpet-platform.exe --help
          Remove-Item Env:PYTHONIOENCODING
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise uv installation with an existing environment override
        shell: pwsh
        run: |
          python -m pip install uv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'DeskPet uv install'
          Copy-Item -Recurse -LiteralPath $pwd -Destination $target
          Set-Location $target
          $sentinel = Join-Path $env:RUNNER_TEMP 'unrelated environment'
          $env:UV_PROJECT_ENVIRONMENT = $sentinel
          ./install-windows.ps1
          if (-not (Test-Path ./.venv/Scripts/deskpet-platform.exe)) { throw 'Local executable missing' }
          if ($env:UV_PROJECT_ENVIRONMENT -ne $sentinel -or (Test-Path $sentinel)) { throw 'Existing environment was modified' }
      - name: Test Windows behavior
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:RUNNER_TEMP 'DeskPet fresh install')
          $env:PYTHONPATH = "$pwd/src;$pwd/tests"
          foreach ($test in @('test_file_lock.py', 'test_windows_pairing.py', 'test_windows_private.py', 'test_windows_scenario.py', 'test_pair_portal.py', 'test_multi_device_flow.py', 'test_pairing_rehearsal.py', 'test_claude_quota.py', 'test_antigravity_quota.py', 'test_quota_capture.py', 'test_quota_projection.py', 'test_quota_display.py', 'test_notification_cache.py', 'test_windows_statusline.py', 'test_quota_windows_statusline.py', 'test_windows_hook_command.py')) {
            & ./.venv/Scripts/python.exe -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & ./.venv/Scripts/python.exe -m unittest test_platform.PlatformTests.test_wifi_probe_accepts_only_the_paired_board_proof test_platform.PlatformTests.test_handshake_display_and_disconnect_on_local_wire test_platform.PlatformTests.test_real_mcp_lists_and_reads_manuals_without_pairing test_multi_device_notifications.NotificationPlatformTests.test_windows_install_is_refused_before_unverified_hooks_are_written test_multi_device_notifications.MultiDeviceNotificationTests.test_windows_notification_setup_does_not_touch_user_settings -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install from a built source release candidate
        shell: pwsh
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --sdist --outdir "$env:RUNNER_TEMP/deskpet-dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = Join-Path $env:RUNNER_TEMP 'DeskPet release archive'
          New-Item -ItemType Directory -Path $destination | Out-Null
          tar -xzf "$env:RUNNER_TEMP/deskpet-dist/deskpet_platform-0.1.0.tar.gz" -C $destination
          Set-Location (Join-Path $destination 'deskpet_platform-0.1.0')
          ./install-windows.ps1
          & ./.venv/Scripts/deskpet-platform.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rehearse actual Claude Code against a synthetic local API
        shell: pwsh
        timeout-minutes: 4
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'DeskPet fresh install'
          Set-Location $target
          & ./.venv/Scripts/python.exe -m pip install pywinpty==2.0.15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP 'deskpet-claude-fixture'
          npm install --prefix $fixture --no-audit --no-fund @anthropic-ai/claude-code@2.1.281
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DESKPET_SYNTHETIC_CLAUDE_CLI = Join-Path $fixture 'node_modules/@anthropic-ai/claude-code/bin/claude.exe'
          $env:DESKPET_REHEARSE_CLAUDE = '1'
          $env:PYTHONPATH = "$pwd/src;$pwd/tests"
          & ./.venv/Scripts/python.exe -m unittest test_windows_claude_client -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rehearse actual Codex against a synthetic local API
        shell: pwsh
        timeout-minutes: 7
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'DeskPet fresh install'
          Set-Location $target
          $fixture = Join-Path $env:RUNNER_TEMP 'deskpet-codex-fixture'
          npm install --prefix $fixture --no-audit --no-fund @openai/codex@0.159.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DESKPET_SYNTHETIC_CODEX_CLI = Join-Path $fixture 'node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe'
          $env:DESKPET_REHEARSE_CODEX = '1'
          $env:PYTHONPATH = "$pwd/src;$pwd/tests"
          & ./.venv/Scripts/python.exe -m unittest test_windows_codex_client -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
