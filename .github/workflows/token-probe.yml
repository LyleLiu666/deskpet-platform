name: Build and verify Token probes
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/deskpet-probe-*']
    paths: ['tools/*token_probe.py', '.github/workflows/token-probe.yml']
  pull_request:
    paths: ['tools/*token_probe.py', '.github/workflows/token-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: macos-arm64
          - runner: windows-latest
            target: windows-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: runner.os != 'macOS'
        with:
          dotnet-version: '10.0.400'
      - name: Build and verify with a synthetic session
        run: python tools/build_token_probe.py dist-probe
      - uses: actions/upload-artifact@v4
        with:
          name: AgentSpeedProbe-${{ matrix.target }}
          path: dist-probe/
          if-no-files-found: error
