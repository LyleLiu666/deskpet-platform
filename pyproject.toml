[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpet-platform"
version = "0.1.0rc7"
description = "Local Wi-Fi SDK and MCP for DeskPet-compatible displays"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp==3.14.5",
    "cryptography==50.0.2",
    "edge-tts==7.3.1",
    "httpx==0.28.1",
    "mcp==1.28.1",
    "Pillow==12.0.0",
    "psutil==7.2.2",
    "pydantic==2.14.3",
    "pyserial==3.5",
]

[project.scripts]
deskpet-platform = "deskpet_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deskpet_platform = ["manuals/*.md", "assets/agent_icons/*.png", "assets/agent_icons/LICENSE", "assets/agent_icons/README.md", "assets/fonts/*", "assets/token_probes/*/*", "assets/token_probes/*/licenses/*", "opencode_plugin.js"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "src/deskpet_platform/**/*.py" },
    { file = "src/deskpet_platform/manuals/*.md" },
    { file = "src/deskpet_platform/assets/agent_icons/*" },
    { file = "src/deskpet_platform/assets/fonts/*" },
    { file = "src/deskpet_platform/assets/token_probes/**/*" },
    { file = "src/deskpet_platform/opencode_plugin.js" },
]
